---

- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for systemd to finish booting
      ansible.builtin.raw: systemctl is-system-running --wait; systemctl list-units --failed --no-legend
      register: __ncpa_systemd_state
      changed_when: false
      failed_when: false
      timeout: 180

    - name: Report the systemd state and failed units
      ansible.builtin.debug:
        var: __ncpa_systemd_state.stdout_lines

    - name: Create the faillock run directory
      ansible.builtin.file:
        path: /run/faillock
        state: directory
        owner: root
        group: root
        mode: '0755'
