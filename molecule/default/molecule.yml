---

role_name_check: 2

driver:
  name: docker

platforms:
  - name: ncpa-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    command: /usr/lib/systemd/systemd
    cgroupns_mode: host
    platform: linux/amd64
    privileged: true
    pre_build_image: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: ncpa-rockylinux9
    image: geerlingguy/docker-rockylinux9-ansible:latest
    command: /usr/lib/systemd/systemd
    cgroupns_mode: host
    platform: linux/amd64
    privileged: true
    pre_build_image: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  config_options:
    defaults:
      inject_facts_as_vars: false
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_SCENARIO_DIRECTORY}/roles

verifier:
  name: ansible
